<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Giovana</title>
    <link rel="stylesheet" href="css/styleContato.css">
</head>
<body>

    <nav class="nav-superior">
        <div class="nav-bg">
            <a href="home.html">Inicio</a>
            <a href="projetos.html">Projetos</a>
            <a href="#">Favoritos</a>
            <a href="contato.html">Contato</a>
        </div>
    </nav>

    <main class="contato-container">
      
        <div class="faixa-fundo-vinho"></div>

        
        <section class="contato-card">
           
            <div class="contato-visual">
                <img src="img/flor_lirio.png" alt="Lírio" class="flor-contato">
                <h1 class="logo-contato">Lírio</h1>
            </div>

            
            <div class="contato-form-area">
                <h2>Fique em Contato</h2>
                <form action="https://www.w3schools.com/action_page.php">
                    <div class="input-grupo">
                        <label>Nome</label>
                        <input type="text" placeholder="------------------------------------------">
                    </div>
                    <div class="input-grupo">
                        <label>Email</label>
                        <input type="email" placeholder="------------------------------------------">
                    </div>
                    <div class="input-grupo">
                        <label>Digite sua mensagem aqui:</label>
                        <textarea placeholder="------------------------------------------"></textarea>
                    </div>
                    <button type="submit" class="btn-enviar">Enviar</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
